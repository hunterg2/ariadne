name: release

# A Windows zip with an embedded Python, built by scripts/build_release.py,
# attached to the GitHub release for the tag that triggered it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  zip:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: ariadne-win64
          path: build/*.zip
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" build/*.zip --clobber
          else
            gh release create "$tag" build/*.zip --title "Ariadne $tag" --generate-notes
          fi
